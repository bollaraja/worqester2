services:
  - type: web
    name: worqester
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: worqester-db
          property: connectionString

databases:
  - name: worqester-db
    plan: free
    databaseName: worqester
    user: worqester
